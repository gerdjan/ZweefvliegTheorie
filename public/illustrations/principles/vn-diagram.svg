<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Schematisch V-n-diagram voor het LS4-voorbeeld</title>
  <desc id="desc">Schematische grafiek met vliegsnelheid horizontaal, belastingfactor verticaal, stallgrens, VA 190 kilometer per uur, Vne 280 kilometer per uur en positieve en negatieve belastingsgrenzen.</desc>
  <rect width="900" height="560" rx="28" fill="#eef8f8"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#173536">
    <text x="450" y="52" text-anchor="middle" font-size="28" font-weight="700">V-n-diagram - bronvoorbeeld LS4</text>
    <line x1="105" y1="455" x2="810" y2="455" stroke="#173536" stroke-width="3"/>
    <line x1="105" y1="500" x2="105" y2="90" stroke="#173536" stroke-width="3"/>
    <text x="456" y="535" text-anchor="middle" font-size="22">Vliegsnelheid V (km/h)</text>
    <text x="33" y="292" text-anchor="middle" font-size="22" transform="rotate(-90 33 292)">Belastingfactor n</text>

    <g stroke="#b7cccc" stroke-width="1">
      <line x1="105" y1="392" x2="810" y2="392"/>
      <line x1="105" y1="329" x2="810" y2="329"/>
      <line x1="105" y1="266" x2="810" y2="266"/>
      <line x1="105" y1="203" x2="810" y2="203"/>
      <line x1="105" y1="140" x2="810" y2="140"/>
      <line x1="105" y1="486" x2="810" y2="486"/>
    </g>

    <g font-size="18">
      <text x="86" y="462" text-anchor="end">0</text>
      <text x="86" y="399" text-anchor="end">1</text>
      <text x="86" y="336" text-anchor="end">2</text>
      <text x="86" y="273" text-anchor="end">3</text>
      <text x="86" y="210" text-anchor="end">4</text>
      <text x="86" y="147" text-anchor="end">5</text>
      <text x="86" y="493" text-anchor="end">-1</text>
    </g>

    <path d="M105 455 C210 446 280 430 350 390 C430 344 485 260 520 121" fill="none" stroke="#bd3a3a" stroke-width="5"/>
    <path d="M105 455 C230 468 360 482 520 500" fill="none" stroke="#bd3a3a" stroke-width="5"/>

    <path d="M285 430 L520 121 L715 190 L715 487 L520 500 Z" fill="#d7eddf" fill-opacity="0.82" stroke="#4d8a63" stroke-width="3"/>
    <line x1="520" y1="455" x2="520" y2="121" stroke="#246e62" stroke-width="4"/>
    <line x1="715" y1="455" x2="715" y2="190" stroke="#932f2f" stroke-width="4"/>
    <line x1="520" y1="121" x2="715" y2="190" stroke="#246e62" stroke-width="4"/>
    <line x1="520" y1="500" x2="715" y2="487" stroke="#246e62" stroke-width="4"/>

    <text x="520" y="478" text-anchor="middle" font-size="20" font-weight="700">VA 190</text>
    <text x="715" y="478" text-anchor="middle" font-size="20" font-weight="700">Vne 280</text>
    <text x="533" y="112" font-size="18">+5,3g bij VA</text>
    <text x="725" y="186" font-size="18">+4g bij Vne</text>
    <text x="535" y="518" font-size="18">-2,65g</text>
    <text x="721" y="505" font-size="18">-1,5g</text>
    <text x="300" y="370" font-size="20" font-weight="700">stallgrens</text>
    <text x="590" y="310" font-size="22" font-weight="700">toegestaan gebied</text>
    <text x="585" y="83" font-size="17">Schematisch - exacte limieten: vlieghandboek</text>
  </g>
</svg>
