  </g>
  <text x="445" y="272" font-family="system-ui, sans-serif" font-size="27" font-weight="750" fill="#17373b">topas</text>
  <text x="420" y="205" font-family="system-ui, sans-serif" font-size="19" fill="#53696d">zwaartepunt</text>
</svg>
